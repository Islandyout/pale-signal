<title>Pale Signal</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070c}
#install{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:20;border:1px solid #1d2c3a;background:rgba(5,7,12,.86);color:#cfe4f2;padding:8px 10px;border-radius:6px;font:12px system-ui,sans-serif;display:none}
</style>
</head>
<body>
<iframe id="game" src="prototype/pale-signal.html.html" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen></iframe>
<button id="install" type="button">Install Pale Signal</button>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
let deferredPrompt=null;
const install=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block';});
install.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.style.display='none';});
window.addEventListener('appinstalled',()=>{install.style.display='none';});
</script>
