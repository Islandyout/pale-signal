name: Live Regression Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'live/**'
      - 'index.html'
      - 'sw.js'
      - 'production/LICENSE_LEDGER.csv'
      - '.github/workflows/live-regression.yml'
  workflow_dispatch:

jobs:
  validate-live-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in live/*.js; do
            [ -e "$file" ] || continue
            found=1
            echo "Checking $file"
            node --check "$file"
          done
          [ "$found" -eq 1 ] || { echo "No live JavaScript files found"; exit 1; }

      - name: Validate live script wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          index = (root / 'index.html').read_text(encoding='utf-8')
          sw = (root / 'sw.js').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\s+src="(live/[^"]+\.js)"', index)
          if not scripts:
              raise SystemExit('No live scripts referenced by index.html')
          errors = []
          for src in scripts:
              if not (root / src).is_file():
                  errors.append(f'missing file referenced by index.html: {src}')
              cached = f"./{src}"
              if cached not in sw:
                  errors.append(f'live script missing from service-worker CORE cache: {cached}')
          if len(scripts) != len(set(scripts)):
              errors.append('duplicate live script reference in index.html')
          cache = re.search(r"const CACHE='([^']+)'", sw)
          if not cache:
              errors.append('service-worker CACHE version not found')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f'Validated {len(scripts)} live scripts; cache={cache.group(1)}')
          PY

      - name: Validate vertical-slice quality contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          contracts = {
              'live/tethys-weather-scanner-v22.js': ['PALE_TETHYS_WEATHER_SCANNER', 'confidence'],
              'live/kestra-language-interior-v23.js': ["id:'language_wall'", "id:'repair_bay'"],
              'live/quality-lift-v24.js': ['PALE_QUALITY_LIFT'],
              'live/visual-coherence-v25.js': ['PALE_VISUAL_COHERENCE'],
              'live/accessibility-recovery-v26.js': ['PALE_ACCESS_RECOVERY'],
              'live/first-hour-gate-v27.js': ['PALE_FIRST_HOUR_GATE'],
              'live/audio-mix-v28.js': ['PALE_AUDIO_MIX'],
              'live/animation-refine-v29.js': ['PALE_ANIMATION_REFINE'],
              'live/mobile-usability-v30.js': ['PALE_MOBILE_USABILITY'],
              'live/pacing-recovery-v31.js': ['PALE_PACING_RECOVERY'],
          }
          errors=[]
          for name,tokens in contracts.items():
              p=pathlib.Path(name)
              if not p.is_file():
                  errors.append(f'missing vertical-slice contract file: {name}')
                  continue
              text=p.read_text(encoding='utf-8')
              missing=[t for t in tokens if t not in text]
              if missing:
                  errors.append(f'{name} missing contract tokens: {missing}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(contracts)} late-stage vertical-slice quality contracts')
          PY

      - name: Validate live-state persistence coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('live/live-persistence-v13.js').read_text(encoding='utf-8')
          required = [
              "key:'pale_signal_live_state_v1'",
              'stationSeen:cleanMap',
              'archSeen:cleanMap',
              'used:cleanMap',
              'checkpointSave=function',
              "addEventListener('pagehide'",
              "addEventListener('beforeunload'",
              'looksLikeFreshGame()',
              'localStorage.removeItem(LP.key)'
          ]
          missing = [x for x in required if x not in p]
          if missing:
              raise SystemExit(f'live-state persistence coverage missing: {missing}')
          lang = pathlib.Path('live/kestra-language-interior-v23.js').read_text(encoding='utf-8')
          if "id:'language_wall'" not in lang or "id:'repair_bay'" not in lang:
              raise SystemExit('Kestra language/workshop persistent station ids missing')
          print('Validated live-layer save, reload, unload and fresh-game reset coverage')
          PY

      - name: Validate profiler shortcut isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          prototype = pathlib.Path('prototype/pale-signal.html.html').read_text(encoding='utf-8')
          qa = pathlib.Path('live/qa-evidence-v20.js').read_text(encoding='utf-8')
          if "e.code==='F9'" not in prototype or "cycleVisualQuality" not in prototype:
              raise SystemExit('base F9 visual-quality control not found')
          required = ["e.code!=='F9'", 'e.ctrlKey||e.metaKey', 'e.stopImmediatePropagation()', 'Ctrl/Cmd+F9']
          missing = [token for token in required if token not in qa]
          if missing:
              raise SystemExit(f'QA profiler shortcut isolation missing tokens: {missing}')
          print('Validated plain F9 quality control and isolated Ctrl/Cmd+F9 QA capture shortcut')
          PY

      - name: Validate license ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, pathlib, sys
          path = pathlib.Path('production/LICENSE_LEDGER.csv')
          if not path.is_file():
              raise SystemExit('production/LICENSE_LEDGER.csv is missing')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          required = {
              'asset_or_tool','source_url','creator','license','commercial_use_ok',
              'attribution_required','modified','project_location','notes'
          }
          if not rows:
              raise SystemExit('license ledger has no entries')
          missing_cols = required - set(rows[0].keys())
          if missing_cols:
              raise SystemExit(f'license ledger missing columns: {sorted(missing_cols)}')
          errors = []
          for i, row in enumerate(rows, start=2):
              missing = [k for k in required if not (row.get(k) or '').strip()]
              if missing:
                  errors.append(f'row {i} missing values: {missing}')
              if (row.get('commercial_use_ok') or '').strip().lower() != 'yes':
                  errors.append(f'row {i} is not approved for commercial use: {row.get("asset_or_tool")}')
          three = [r for r in rows if (r.get('asset_or_tool') or '').lower().startswith('three.js r160')]
          if not three or three[0].get('license') != 'MIT':
              errors.append('embedded Three.js r160 MIT provenance is not recorded')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f'Validated {len(rows)} license/provenance entries; all marked commercial-use compatible')
          PY

      - name: Validate core shell files
        shell: bash
        run: |
          set -euo pipefail
          test -f prototype/pale-signal.html.html
          test -f manifest.webmanifest
          test -f icon.svg
          grep -q 'prototype/pale-signal.html.html' index.html
          grep -q './prototype/pale-signal.html.html' sw.js
