name: Reboot Godot CI

on:
  push:
    branches: [reboot-godot]
    paths:
      - 'reboot/**'
      - '.github/workflows/reboot-godot-ci.yml'
  pull_request:
    paths:
      - 'reboot/**'
      - '.github/workflows/reboot-godot-ci.yml'

concurrency:
  group: reboot-godot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contracts-and-exports:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic asset-fetch tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 ca-certificates
      - name: Configure Godot Android toolchain
        run: |
          set -eu
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -d /usr/lib/android-sdk
          test -f /root/debug.keystore
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
            'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
            'export/android/debug_keystore = "/root/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.7.tres"
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          "$JAVA_HOME/bin/java" -version
      - name: Fetch audited CC0 production assets
        run: |
          set -eu
          python3 reboot/tools/fetch_cc0_assets.py
          test -f reboot/assets/imported/ship_player.gltf
          test -f reboot/assets/imported/eva_suit.glb
          test -f reboot/assets/imported/talari_civilian.glb
          test -f reboot/assets/imported/kestra_module.glb
          test -f reboot/assets/imported/humanoid_animations.glb
      - name: Import project and fail on parser errors
        run: |
          set -eu
          out="$(godot --headless --path reboot --editor --quit 2>&1 || true)"
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script'; then
            echo 'Godot parser/compile error detected.' >&2
            exit 1
          fi
      - name: Verify real GLB and glTF imports
        run: godot --headless --path reboot --script res://tests/asset_import_test.gd
      - name: Run mechanic contracts
        run: godot --headless --path reboot --script res://tests/run_tests.gd
      - name: Verify scanner skill contract
        run: godot --headless --path reboot --script res://tests/scanner_skill_test.gd
      - name: Verify archaeology evidence layers
        run: godot --headless --path reboot --script res://tests/archaeology_evidence_test.gd
      - name: Verify Tethys/Kestra production scope
        run: godot --headless --path reboot --script res://tests/kestra_scope_test.gd
      - name: Verify Pale Signal phenomenon isolation
        run: godot --headless --path reboot --script res://tests/pale_signal_test.gd
      - name: Verify mobile mode transitions release held input
        run: godot --headless --path reboot --script res://tests/mobile_controls_test.gd
      - name: Verify save corruption recovery
        run: godot --headless --path reboot --script res://tests/save_recovery_test.gd
      - name: Verify Flat Grazer herd behavior
        run: godot --headless --path reboot --script res://tests/wildlife_test.gd
      - name: Verify GLB adapter paths
        run: |
          grep -q 'ship_player.gltf' reboot/scripts/asset_loader.gd
          grep -q 'humanoid_animations.glb' reboot/scripts/asset_loader.gd
          grep -q 'talari_civilian.glb' reboot/scripts/asset_loader.gd
      - name: Verify tutorial cannot auto-complete flight
        run: |
          ! grep -R 'global_position *=.*nav_target' reboot/scripts/tutorial_director.gd
          grep -q 'event("launched")' reboot/scripts/game_root.gd
          grep -q 'event("touchdown"' reboot/scripts/game_root.gd
      - name: Verify mobile cinematic skip parity
        run: |
          set -eu
          grep -q '_build_cutscene_skip_button()' reboot/scripts/mobile_controls.gd
          grep -q '_tap_action("cutscene_skip")' reboot/scripts/mobile_controls.gd
          grep -q 'DisplayServer.is_touchscreen_available() and not visible' reboot/scripts/mobile_controls.gd
          grep -q 'mobile_controls.visible = false' reboot/scripts/game_root.gd
      - name: Verify wildlife investigation contract
        run: |
          set -eu
          grep -q 'var grazer := Interactable.new()' reboot/scripts/wildlife_system.gd
          grep -q 'interaction_id = "wildlife|flat_grazer|' reboot/scripts/wildlife_system.gd
          grep -q 'collision.name = "ScannerBody"' reboot/scripts/wildlife_system.gd
          grep -q 'if target == sample:' reboot/scripts/game_root.gd
          grep -q 'target.interaction_id.begins_with("wildlife|flat_grazer|")' reboot/scripts/game_root.gd
      - name: Verify archaeology input isolation contract
        run: |
          set -eu
          grep -q 'add_to_group("eva_controller")' reboot/scripts/eva_controller.gd
          grep -q 'var movement_enabled := true' reboot/scripts/eva_controller.gd
          grep -q '_set_eva_movement(false)' reboot/scripts/archaeology_system.gd
          grep -q '_set_eva_movement(true)' reboot/scripts/archaeology_system.gd
          grep -q 'call_group("eva_controller", "set_movement_enabled", value)' reboot/scripts/archaeology_system.gd
      - name: Verify archaeology guide audio only runs during reconstruction
        run: |
          set -eu
          grep -q 'var reconstruction_running := _archaeology != null and is_instance_valid(_archaeology) and _archaeology.active' reboot/scripts/audio_director.gd
          grep -q '_reconstruction_active = reconstruction_running' reboot/scripts/audio_director.gd
          grep -q '_reconstruction_lock_ready = reconstruction_running and lock_ready' reboot/scripts/audio_director.gd
      - name: Prepare Godot export templates
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates"
          src=""
          for p in /root/.local/share/godot/export_templates/4.7.2.stable /root/.local/share/godot/export_templates/4.7.2 /opt/godot/export_templates/4.7.2.stable /opt/godot/export_templates/4.7.2; do
            if [ -d "$p" ]; then src="$p"; break; fi
          done
          if [ -z "$src" ]; then
            src="$(find / -type d \( -name '4.7.2.stable' -o -name '4.7.2' \) -path '*export_templates*' 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$src"
          rm -rf "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R "$src" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/windows_release_x86_64.exe"
      - name: Export Web build
        run: |
          set -eu
          mkdir -p reboot/build/web
          godot --headless --path reboot --export-release "Web" build/web/index.html --verbose
          test -f reboot/build/web/index.html
          test -f reboot/build/web/index.wasm
          test -f reboot/build/web/index.pck
          printf '%s\n' "$GITHUB_SHA" > reboot/build/web/BUILD_SOURCE.txt
      - name: Export Android debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -eu
          mkdir -p reboot/build/android
          godot --headless --path reboot --export-debug "Android Debug" build/android/PaleSignal-debug.apk --verbose
          test -s reboot/build/android/PaleSignal-debug.apk
          printf '%s\n' "$GITHUB_SHA" > reboot/build/android/BUILD_SOURCE.txt
      - name: Export Windows desktop build
        run: |
          set -eu
          mkdir -p reboot/build/windows
          godot --headless --path reboot --export-release "Windows Desktop" build/windows/PaleSignal.exe --verbose
          test -s reboot/build/windows/PaleSignal.exe
          printf '%s\n' "$GITHUB_SHA" > reboot/build/windows/BUILD_SOURCE.txt
      - name: Upload playable Web build
        uses: actions/upload-artifact@v4
        with:
          name: pale-signal-reboot-web
          path: reboot/build/web
          if-no-files-found: error
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pale-signal-reboot-android-debug
          path: |
            reboot/build/android/PaleSignal-debug.apk
            reboot/build/android/BUILD_SOURCE.txt
          if-no-files-found: error
      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v4
        with:
          name: pale-signal-reboot-windows
          path: |
            reboot/build/windows/PaleSignal.exe
            reboot/build/windows/BUILD_SOURCE.txt
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/reboot-godot'
    needs: contracts-and-exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: pale-signal-reboot-web
          path: exported-web
      - name: Publish isolated reboot preview
        run: |
          set -eu
          rm -rf reboot-preview
          mkdir -p reboot-preview
          cp -a exported-web/. reboot-preview/
          touch reboot-preview/.nojekyll
          git config user.name 'Pale Signal Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A reboot-preview
          if git diff --cached --quiet; then
            echo 'Preview already current.'
            exit 0
          fi
          git commit -m "Publish Godot reboot preview ${GITHUB_SHA::8}"
          git push origin HEAD:main
