name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'prototype/**'
      - 'live/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle current Pale Signal live build
        run: |
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets/prototype
          mkdir -p android-app/app/src/main/assets/live
          cp index.html android-app/app/src/main/assets/index.html
          cp prototype/pale-signal.html.html android-app/app/src/main/assets/prototype/pale-signal.html.html
          cp live/*.js android-app/app/src/main/assets/live/
          cp manifest.webmanifest android-app/app/src/main/assets/manifest.webmanifest
          cp icon.svg android-app/app/src/main/assets/icon.svg

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaleSignal-Android
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
